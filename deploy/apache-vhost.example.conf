<VirtualHost *:80>
    ServerName thauphim.example.com
    DocumentRoot "D:/Xampp/htdocs/thauphim-movie-website"

    <Directory "D:/Xampp/htdocs/thauphim-movie-website">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/thauphim-error.log"
    CustomLog "logs/thauphim-access.log" common
</VirtualHost>
